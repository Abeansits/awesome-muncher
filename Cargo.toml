[package]
name = "awesome-muncher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A TUI for exploring awesome lists and discovering active vs abandoned projects"
authors = ["Sebastian Nystorm"]
license = "MIT"

[dependencies]
# TUI Framework
ratatui = "0.29"
crossterm = "0.28"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Markdown Parsing
pulldown-cmark = "0.12"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error Handling
color-eyre = "0.6"
thiserror = "2"

# Regex for parsing
regex = "1"

# Async channels for background tasks
futures = "0.3"

# Directory paths for config
directories = "5"

# Random for witty messages
rand = "0.8"

# URL parsing
url = "2"
open = "5.3.3"

[dev-dependencies]
# Testing
insta = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
